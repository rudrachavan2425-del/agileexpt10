{% extends "base.html" %}

{% block title %}Page Not Found (404) | Placement Management System{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-md-6">
    <div class="display-1 fw-bold text-warning mb-3">404</div>
    <h3 class="fw-bold mb-3">Resource Not Found</h3>
    <p class="text-muted mb-4">
      The requested page, job opening, or profile record does not exist or has been removed.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4">Back to Safety</a>
  </div>
</div>
{% endblock %}
