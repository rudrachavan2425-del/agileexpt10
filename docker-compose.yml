services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: placement-management-web:latest
    container_name: placement_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=placement-super-secret-key-change-in-production-2026
      - DATABASE_URL=sqlite:////app/instance/placement.db
      - UPLOAD_FOLDER=/app/uploads
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    volumes:
      - placement_instance:/app/instance
      - placement_uploads:/app/uploads
    networks:
      - placement-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: placement_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - placement-net
    depends_on:
      web:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.0.0
    container_name: placement_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards/placement-dashboard.json:/etc/grafana/provisioning/dashboards/placement-dashboard.json:ro
    networks:
      - placement-net
    depends_on:
      - prometheus

networks:
  placement-net:
    driver: bridge
    name: placement-net

volumes:
  placement_instance:
    name: placement_instance
  placement_uploads:
    name: placement_uploads
  grafana_data:
    name: placement_grafana_data
