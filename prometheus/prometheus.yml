global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'placement_app'
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['web:5000']
        labels:
          application: 'placement-management-system'
          environment: 'production'

  - job_name: 'node_exporter'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          application: 'node-exporter'
          environment: 'production'
